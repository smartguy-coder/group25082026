# ============================================================
# Пайплайн №1 — найпростіший. Просто вітається.
# Мета: побачити, з чого взагалі складається GitHub Actions workflow.
# ============================================================

# Ім'я, яке буде видно у вкладці "Actions" на GitHub
name: 01 · Hello

# КОЛИ запускати цей пайплайн (тригери)
on:
  push:               # на кожен git push у будь-яку гілку
  workflow_dispatch:  # + кнопка "Run workflow" для ручного запуску

# ЩО робити. Пайплайн складається з джоб (jobs), джоба — зі кроків (steps).
jobs:
  hello:                     # id джоби (довільна назва)
    runs-on: ubuntu-latest   # на якій машині виконувати (віртуалка від GitHub)
    steps:
      - name: Привітання
        run: echo "Привіт, світе! 👋 Це мій перший GitHub Actions пайплайн."

      - name: Трохи контексту про запуск
        run: |
          echo "Гілка:  ${{ github.ref_name }}"
          echo "Автор:  ${{ github.actor }}"
          echo "Подія:  ${{ github.event_name }}"
