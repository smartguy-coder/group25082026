# ============================================================
# Пайплайн №3 — паралельні джоби.
# Мета: показати два способи паралелити роботу:
#   1) кілька незалежних джоб БЕЗ needs — стартують одночасно;
#   2) matrix — одна джоба розмножується на кілька значень одразу.
# ============================================================

name: 03 · Паралельні джоби

on:
  push:
  workflow_dispatch:

jobs:
  # --- Спосіб 1: три незалежні джоби. Жодна не має needs,
  #     тому GitHub запускає їх ПАРАЛЕЛЬНО (кожна на своїй машині). ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🔍 Лінтимо код..."
          sleep 3
          echo "Лінт готовий"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🔒 Перевірка безпеки..."
          sleep 3
          echo "Безпека ок"

  docs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "📚 Генеруємо документацію..."
          sleep 3
          echo "Доки готові"

  # --- Спосіб 2: matrix. Ця джоба виконається 3 рази паралельно —
  #     по разу на кожне значення python-version. ---
  matrix-demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - run: echo "Паралельний прогін для Python ${{ matrix.python-version }}"
